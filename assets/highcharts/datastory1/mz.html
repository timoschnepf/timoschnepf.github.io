<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Wer macht was?</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    /* Make sizing predictable */
* { box-sizing: border-box; }

html, body { height: 100%; }
body {
  margin: 0;
  padding: 12px;
  font-family: "Inter", -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
}

/* Optional: a max width wrapper so the chart doesn't get crazy wide on desktops */
.wrap {
  max-width: 1200px;
  margin: 0 auto;
}

/* Slim, responsive chart box */
#container {
  width: 100%;
  /* Height follows width; keeps things smooth on resize */
  aspect-ratio: 16 / 10;
  /* Safety bounds so it’s usable everywhere */
  min-height: 320px;
  max-height: 85vh;

  border-radius: 12px;
  overflow: hidden;
}

/* If you still want a “card” feel without layout penalty */
#container {
  background: #fff;
  box-shadow: 0 4px 18px rgba(0,0,0,0.06);
}

/* Tweak Highcharts title wrapping on narrow screens */
#container .highcharts-title {
  white-space: normal !important;
}
  </style>
<script src="https://code.highcharts.com/highcharts.js"></script>
<script src="https://code.highcharts.com/modules/treemap.js"></script>
<script src="https://code.highcharts.com/modules/exporting.js"></script>
<script src="https://code.highcharts.com/modules/accessibility.js"></script>
<script src="https://code.highcharts.com/themes/adaptive.js"></script>
</head>
<body>
<div class="wrap">
  <div id="container"></div>
</div>
  </div>

<script>

        align: 'left',

    subtitle: {

</html>
